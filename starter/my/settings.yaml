# my/settings.yaml — YOUR values, merged over config/aios.config.yaml at load.
#
# This file is yours. An update from us never touches it, and nothing in here is a secret —
# secrets live in .env at the top of the box. Anything you set here wins over the shipped
# config, so you can take our updates without ever editing the tracked file.
#
# Uncomment what you need. An empty file is valid and changes nothing.

# spaces:
