# The Unified Inbox describes itself here (core/machines.py, docs/SCOPE_MACHINE_MARKETPLACE.md §3.3).
# The box reads this file to know the machine exists: its feature, what it's made of, where it loads
# and which tiers include it. Nothing else in the box names this machine.
addon: 1
slug: inbox                        # feature machine:inbox, the name plans and orders already use
name: Unified Inbox
modules:                           # the prefixes that ARE this machine; the plan gates all of them
  - marketing.customer_voice       # the inbox, its app, and its rails
worker:
  - marketing.customer_voice.inbox # the unified inbox: poll + instant opener (inert until a Space Zernio key)
  - marketing.customer_voice       # uptime + PageSpeed today; reviews/comments/search as their accounts connect
web:
  - marketing.customer_voice.app   # /inbox/*: login-only, no public tier (what a named customer said has no safe redacted form)
tiers: [pro]                       # Pro includes it; Base gets it through a plan's add:
product:
  name: Unified Inbox
# Its menu rows are registered by marketing/customer_voice/app.py. Its `customer_voice:` and `inbox:`
# config sections still live in config/aios.config.yaml for now (a manifest's config: sits beneath
# the tracked file, so moving them later changes nothing a box reads).
